name = "softfloat-floatlib-verification"
version = "0.1.0"
# Mathlib and FloatLib set requiresModuleSystem, so Lake warns when a file
# without a `module` header imports them. The files here do not use the module
# system.
allowNonModules = true
defaultTargets = ["SoftFloatFloatLibSpec", "SoftFloatFloatLibProof", "SoftFloatFloatLibTest"]

[leanOptions]
autoImplicit = false

[[require]]
name = "softfloat-floatlib-operators"
path = "../floatlib-operators"

[[require]]
name = "softfloat-core-verification"
path = "../core-verification"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

# FloatLib is fixed by its commit, not by a tag or a branch, so that what is
# compared does not move.
[[require]]
name = "floatlib"
git = "https://github.com/lean-dojo/FloatLib"
rev = "8c8871576a941a86e73dcf0882702b823139aa93"

# The choices of FloatLib as a predicate on a specialization, and the maps
# between the bit strings and flags of SoftFloat and the values and status of
# FloatLib, with the operations of FloatLib seen through them.
[[lean_lib]]
name = "SoftFloatFloatLibSpec"
globs = ["SoftFloat.FloatLib.Spec.+"]

# The proofs: the specialization floatlib is valid and has the choices of
# FloatLib.
[[lean_lib]]
name = "SoftFloatFloatLibProof"
globs = ["SoftFloat.FloatLib.Proof.+"]

# Comparisons on chosen inputs, evaluated while building. They are not proofs.
[[lean_lib]]
name = "SoftFloatFloatLibTest"
globs = ["SoftFloat.FloatLib.Test.+"]
