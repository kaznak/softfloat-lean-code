name = "softfloat-riscv-operators"
version = "0.1.0"
defaultTargets = ["SoftFloatRISCVBase", "SoftFloatRISCVOperators"]

[leanOptions]
autoImplicit = false

[[require]]
name = "softfloat-core-operators"
path = "../core-operators"

[[lean_lib]]
name = "SoftFloatRISCVBase"
globs = ["SoftFloat.RISCV.Base.*"]

[[lean_lib]]
name = "SoftFloatRISCVOperators"
globs = ["SoftFloat.RISCV.Operators.*"]
