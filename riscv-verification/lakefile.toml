name = "softfloat-riscv-verification"
version = "0.1.0"
# Mathlib sets requiresModuleSystem, so Lake warns when a file without a
# `module` header imports it. The files here do not use the module system.
allowNonModules = true
defaultTargets = ["SoftFloatRISCVSpec", "SoftFloatRISCVProof", "SoftFloatRISCVClaim", "SoftFloatRISCVTest", "testfloat_check"]

[leanOptions]
autoImplicit = false

[[require]]
name = "softfloat-riscv-operators"
path = "../riscv-operators"

[[require]]
name = "softfloat-core-verification"
path = "../core-verification"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.35.0"

[[lean_lib]]
name = "SoftFloatRISCVSpec"
globs = ["SoftFloat.RISCV.Spec.+"]

[[lean_lib]]
name = "SoftFloatRISCVProof"
globs = ["SoftFloat.RISCV.Proof.+"]

[[lean_lib]]
name = "SoftFloatRISCVClaim"
globs = ["SoftFloat.RISCV.Claim.*"]

[[lean_lib]]
name = "SoftFloatRISCVTest"
globs = ["SoftFloat.RISCV.Test.+"]

[[lean_exe]]
name = "testfloat_check"
root = "SoftFloat.RISCV.Test.Main"
